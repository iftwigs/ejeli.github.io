<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ejeli — gallery</title>
  <link rel="stylesheet" href="style.css">
  <!-- apply stored theme before first paint to prevent flash -->
  <script>if(localStorage.getItem('ejeli-theme')==='light')document.documentElement.classList.add('light');</script>
</head>
<body>

  <nav>
    <div class="container">
      <div class="nav-inner">
        <a href="index.html" class="nav-logo">EJELI</a>
        <div class="nav-links">
          <a href="gallery.html">gallery</a>
          <a href="index.html#about">about</a>
          <a href="index.html#contact">contact</a>
          <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">light</button>
        </div>
      </div>
    </div>
  </nav>

  <main>
    <div class="container">

      <div class="gallery-header">
        <a href="index.html" class="back-link">← back</a>
        <p class="section-label">all works</p>
      </div>

      <div class="masonry">

        <div class="artwork">
          <div class="artwork-placeholder"></div>
          <p class="artwork-title">blue monday</p>
        </div>

        <div class="artwork">
          <div class="artwork-placeholder"></div>
          <p class="artwork-title">sakhalin</p>
        </div>

        <div class="artwork">
          <div class="artwork-placeholder"></div>
          <p class="artwork-title">light penetrating the balcony</p>
        </div>

        <div class="artwork">
          <div class="artwork-placeholder"></div>
          <p class="artwork-title">dialogues series</p>
        </div>

        <div class="artwork">
          <div class="artwork-placeholder"></div>
          <p class="artwork-title">ass</p>
        </div>

        <div class="artwork">
          <div class="artwork-placeholder"></div>
          <p class="artwork-title">two roads</p>
        </div>

        <div class="artwork">
          <div class="artwork-placeholder"></div>
          <p class="artwork-title">2015 house on legs</p>
        </div>

      </div>
    </div>
  </main>

  <footer id="contact">
    <div class="container">
      <div class="footer-inner">
        <span class="section-label">contact</span>
        <span class="footer-links">
          <a href="mailto:k4www4@gmail.com">k4www4@gmail.com</a>
          &nbsp;/&nbsp;
          <a href="https://ejeli.com" target="_blank" rel="noopener noreferrer">ejeli.com</a>
        </span>
      </div>
    </div>
  </footer>

  <script>
    (function () {
      var stored = localStorage.getItem('ejeli-theme');
      var btn = document.getElementById('theme-toggle');
      if (stored === 'light') {
        btn.textContent = 'dark';
      }
      btn.addEventListener('click', function () {
        var isLight = document.documentElement.classList.toggle('light');
        localStorage.setItem('ejeli-theme', isLight ? 'light' : 'dark');
        btn.textContent = isLight ? 'dark' : 'light';
      });
    })();
  </script>

</body>
</html>
